# Local load balancer in front of the url-shortener replicas (docs/DESIGN.md §12).

# Docker's embedded DNS. Re-resolving every 10 s picks up replicas added with --scale or restarted with a new IP.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream url_shortener {
    zone url_shortener 64k;
    server url-shortener:8080 resolve max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 64k;   # largest request is a batch create; long URLs are capped at 2048 chars

    # Inherited by every proxy_pass below. The app trusts these (SERVER_FORWARD_HEADERS_STRATEGY=native),
    # so generated short URLs and client IPs are the caller's, not the load balancer's.
    proxy_http_version 1.1;
    proxy_set_header Connection "";   # reuse upstream keepalive connections
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Request-Id $request_id;

    proxy_connect_timeout 1s;
    proxy_read_timeout 10s;
    # Retry another replica on a failed or timed-out connection. Without "non_idempotent", nginx never resends a
    # POST or PATCH that already reached a replica, so a create is never sent twice.
    proxy_next_upstream error timeout;
    proxy_next_upstream_tries 2;

    # The load balancer's own liveness, used by the compose healthcheck. Doesn't touch the app.
    location = /lb-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Only health is public; metrics and other actuator endpoints stay inside the network.
    location /actuator/ {
        return 404;
    }

    location /actuator/health {
        proxy_pass http://url_shortener;
    }

    location / {
        proxy_pass http://url_shortener;
    }
}

# Connection and request counters for nginx-prometheus-exporter. Port 8081 is only exposed on the compose
# network, never published to the host, so it isn't reachable through the load balancer.
server {
    listen 8081;
    server_name _;
    access_log off;

    location = /stub_status {
        stub_status;
    }

    location / {
        return 404;
    }
}
