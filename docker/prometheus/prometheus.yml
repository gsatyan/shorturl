# Local Prometheus (docs/DESIGN.md §10). Scrapes every app replica directly, never through nginx:
# through the load balancer each scrape would hit a random replica, and nginx hides /actuator/prometheus anyway.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: url-shortener
    metrics_path: /actuator/prometheus
    # Docker DNS returns one A record per replica, so --scale url-shortener=N is picked up automatically.
    dns_sd_configs:
      - names: [url-shortener]
        type: A
        port: 8080
        refresh_interval: 15s

  - job_name: relay
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: [relay]
        type: A
        port: 8080
        refresh_interval: 15s

  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]

  - job_name: nginx
    static_configs:
      - targets: [nginx-exporter:9113]

  - job_name: kafka
    static_configs:
      - targets: [kafka-exporter:9308]

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
